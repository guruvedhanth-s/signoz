apiVersion: reliability/v1
kind: TelemetryProfile

metadata:
  name: support-agent
  service: support-agent
  environment: local

spec:
  data_kind: ai_agent
  source:
    adapter: signoz
    endpoint: http://localhost:8080

  signals:
    traces:
      root_span: agent.run
      spans:
        - name: model.chat
          fields:
            - path: gen_ai.provider.name
              type: string
              required: true
            - path: gen_ai.request.model
              type: string
              required: true
            - path: gen_ai.usage.input_tokens
              type: integer
              required: true
            - path: gen_ai.usage.output_tokens
              type: integer
              required: true
        - name: evaluation.groundedness
          fields:
            - path: evaluation.grounded
              type: boolean
              required: true

  # The five checks named by PRD section 8 (Track A), plus one AI-agent-
  # specific check this profile already carried (groundedness-verdict).
  audit_rules:
    - id: missing_service_name
      type: required_field
      signal: traces
      field: service.name
      severity: blocker
      recommendation: Set service.name in the OpenTelemetry resource.

    - id: missing_model_name
      type: required_field
      signal: traces
      applies_to: model.chat
      field: gen_ai.request.model
      severity: warning
      recommendation: Record the requested model on every model span.

    - id: missing_token_usage
      type: required_field
      signal: traces
      applies_to: model.chat
      field: gen_ai.usage.input_tokens
      severity: warning
      recommendation: Record input token usage on every model span.

    - id: high_cardinality_attribute
      type: cardinality
      signal: traces
      field: gen_ai.request.model
      max_distinct_values: 20
      severity: warning
      recommendation: >-
        Model names should stay within a small, bounded set; an unbounded
        value here usually means a per-request identifier (a session id, a
        user id) was attached to this field instead.

    - id: stale_service
      type: freshness
      signal: traces
      field: timestamp
      max_age: 5m
      severity: blocker
      recommendation: >-
        This service has not emitted any traces recently - confirm it is
        still running and instrumented. "timestamp" is set on every
        record regardless of its other fields, so this checks for any
        recent activity from the service at all, not one specific field.

    - id: groundedness-verdict
      type: required_field
      signal: traces
      applies_to: evaluation.groundedness
      field: evaluation.grounded
      severity: blocker
      recommendation: Record a structured grounding verdict.
