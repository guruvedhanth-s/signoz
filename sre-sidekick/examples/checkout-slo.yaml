version: "1"
service: checkout-api
environment: test

slos:
  - name: request-success
    description: Checkout requests should succeed.
    type: ratio
    target: 0.995
    window: 30d
    requires_completeness: true
    completeness_threshold: 0.95
    good_metric: http_server_request_success_total
    total_metric: http_server_request_total
    dependencies:
      - http_server_request_success_total
      - http_server_request_total

  - name: request-latency
    description: Checkout requests should complete within one second.
    type: latency_threshold
    target: 0.99
    window: 30d
    latency_metric: http_server_request_duration_seconds
    threshold_ms: 1000
    # This histogram follows the OTel semantic-convention "_seconds" naming
    # and stores its "le" bucket boundaries in seconds. SigNoz's own
    # zero-instrumentation "signoz_latency" metric does not - it uses
    # milliseconds (the default when this field is omitted). Always check
    # the actual stored "le" values for a given latency_metric before
    # relying on this SLO; getting it wrong does not error, it silently
    # reports a much lower SLI than reality.
    latency_bucket_unit: s
