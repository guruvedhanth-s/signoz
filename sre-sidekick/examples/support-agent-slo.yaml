version: "1"
service: support-agent
environment: local

slos:
  - name: grounded-answers
    description: Answers should be grounded in retrieved evidence.
    type: grounded_answers
    target: 0.95
    # 1h keeps this demo config aligned with a live demo-agent that has
    # only been emitting telemetry for minutes: SigNoz widens the query
    # step for very long windows (30d), and "increase" cannot be computed
    # for a step that does not yet contain two samples. A production
    # config for a long-running service should use a longer window (e.g.
    # 30d) instead.
    window: 1h
    requires_completeness: true
    completeness_threshold: 0.95
    good_metric: agent_grounded_answers_total
    total_metric: agent_evaluated_answers_total
    dependencies:
      - agent_grounded_answers_total
      - agent_evaluated_answers_total

  - name: support-agent-span-latency
    description: >-
      99% of support-agent spans (across all operations - deriveMetricQueries
      scopes only by service/environment, not per-operation) should complete
      within 1 second. Uses SigNoz's own zero-instrumentation latency
      histogram (signoz_latency, generated by the spanmetrics processor from
      trace data - no custom metric instrumentation needed).
    type: latency_threshold
    target: 0.99
    window: 1h
    latency_metric: signoz_latency
    threshold_ms: 1000
    # signoz_latency's "le" boundaries are milliseconds (latency_bucket_unit
    # defaults to "ms" - no need to set it here), but its real child metrics
    # are dot-separated (signoz_latency.bucket, signoz_latency.count), not
    # the OTel semantic-convention underscore suffix (signoz_latency_bucket,
    # signoz_latency_count) latency_metric alone would derive. Both were
    # confirmed live against a running SigNoz instance.
    latency_bucket_metric: signoz_latency.bucket
    latency_count_metric: signoz_latency.count
    # signoz_latency is derived from trace resource attributes, so it
    # carries the OTel resource semantic-convention keys ("service.name",
    # "deployment.environment"), not this file's other SLO's custom
    # counter attribute keys ("service_name"/"environment", the config-wide
    # default). Confirmed live: without these, the filter matches nothing
    # and the SLO silently reports indeterminate.
    service_label: service.name
    environment_label: deployment.environment
    # signoz_latency.bucket/.count are Delta temporality (spanmetrics-
    # processor output), not the Cumulative default that matches a typical
    # OTel-SDK counter. Confirmed live: the same "increase" query returned
    # no data with Cumulative and the real count with Delta.
    metric_temporality: delta
